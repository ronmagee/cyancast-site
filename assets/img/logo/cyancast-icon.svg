<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" role="img" aria-label="CyanCast">
  <title>CyanCast</title>
  <defs>
    <linearGradient id="cy" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- Main C: thick ring with upper-right gap -->
  <path d="M 169.28 60 A 80 80 0 1 0 169.28 140"
        stroke="url(#cy)" stroke-width="30" fill="none" stroke-linecap="round"/>

  <!-- Sound burst: three arcs emanating from the gap -->
  <path d="M 183 82 A 20 20 0 0 1 183 118"
        stroke="url(#cy)" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M 195 70 A 32 32 0 0 1 195 130"
        stroke="url(#cy)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 207 58 A 44 44 0 0 1 207 142"
        stroke="url(#cy)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.65"/>
</svg>